<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Otherwise</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#fff;--fg:#111;--mut:#80807a;--line:#eeeeea;--acc:#b8924a;--card:#f6f6f3}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:#ffffffe6;backdrop-filter:blur(12px);display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);z-index:5}
.logo{font-weight:800;font-size:23px;letter-spacing:-.8px}
.cartbtn{background:var(--fg);color:#fff;border:0;border-radius:99px;padding:10px 18px;font:700 14px Manrope;transition:.2s}
.cartbtn:active{transform:scale(.95)}
.hero{margin:14px 16px;padding:38px 24px;border-radius:24px;background:linear-gradient(135deg,#17171a,#3a2f1c);color:#fff;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(#b8924a66,transparent 70%)}
.hero h1{font-size:34px;font-weight:800;line-height:1.08;letter-spacing:-1px}
.hero p{color:#ffffffb0;margin-top:10px;font-size:15px}
.tools{padding:6px 16px 0;display:grid;gap:10px}
input,select,textarea{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;font:500 16px Manrope;background:var(--card);outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--fg);background:#fff}
.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 18px;font:600 13px Manrope;transition:.2s}
.chip.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:4px 16px 50px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.p{cursor:pointer;animation:fade .5s both}
.p .im{position:relative;border-radius:20px;overflow:hidden;background:var(--card)}
.p img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;transition:transform .5s}
.p:hover img{transform:scale(1.05)}
.p:active{transform:scale(.98)}
.p b{display:block;font-size:14px;margin:10px 2px 2px;font-weight:600}
.p span{font-weight:800;font-size:15px;margin:0 2px}
.badge{position:absolute;left:10px;top:10px;font-size:11px;font-weight:700;background:var(--acc);color:#fff;border-radius:8px;padding:4px 9px}
.sk{aspect-ratio:3/4;border-radius:20px;background:linear-gradient(90deg,#f0f0ec,#fafaf8,#f0f0ec);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@keyframes fade{from{opacity:0;transform:translateY(14px)}}
.sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:10}
.sheet.open{display:flex}
.box{background:#fff;width:100%;max-width:640px;margin:auto auto 0;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(28px + env(safe-area-inset-bottom));animation:up .3s}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.big{width:100%;border-radius:18px;max-height:52vh;object-fit:cover;display:block}
.thumbs{display:flex;gap:8px;margin:10px 0;overflow-x:auto}
.thumbs img{width:58px;height:72px;object-fit:cover;border-radius:10px;opacity:.55;border:2px solid transparent;transition:.2s}
.thumbs img.on{opacity:1;border-color:var(--fg)}
.opt{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
.btn{width:100%;background:var(--fg);color:#fff;border:0;border-radius:16px;padding:16px;font:700 16px Manrope;margin-top:10px;transition:.2s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5}
.btn.alt{background:var(--card);color:var(--fg)}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:8px}
.row img{width:46px;height:58px;border-radius:10px;object-fit:cover}
.x{border:0;background:none;color:#c33;font-size:22px}
.pay{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;text-align:center}
.pay b{font-size:22px;letter-spacing:1px;display:block;margin:6px 0}
h2{margin-bottom:10px;letter-spacing:-.4px}small{color:var(--mut)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--fg);color:#fff;padding:12px 20px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;transition:.3s;z-index:20;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header><div class="logo">Otherwise</div><button class="cartbtn" onclick="openCart()">Себет · <span id="cnt">0</span></button></header>
<section class="hero"><h1>Өзүңдүн<br>стилиңди тап.</h1><p>Жаңы кийимдер, ыңгайлуу баалар.</p></section>
<div class="tools"><input id="q" type="search" enterkeyhint="search" placeholder="Кийим издөө..." oninput="render()" onkeydown="if(event.key==='Enter')this.blur()">
<select id="sort" onchange="render()"><option value="">Жаңылары</option><option value="asc">Баасы: арзандан кымбатка</option><option value="desc">Баасы: кымбаттан арзанга</option></select></div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="box" id="box"></div></div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://qxdfdshjqlplvcjzweqf.supabase.co';
const SUPABASE_KEY='sb_publishable_JVNERPgNvRzjoGTjmj8wKw_kvRZKCPz';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const TGW=window.Telegram&&Telegram.WebApp;
if(TGW){try{TGW.ready();TGW.expand()}catch(e){}}
const tgId=(TGW&&TGW.initDataUnsafe&&TGW.initDataUnsafe.user&&TGW.initDataUnsafe.user.id)||null;
let products=[],cats=[],cat=0,cart=[],card='';
try{cart=JSON.parse(localStorage.getItem('cart')||'[]')}catch(e){}
const $=id=>document.getElementById(id);
const som=n=>Number(n).toLocaleString('ru-RU')+' сом';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem('cart',JSON.stringify(cart))}catch(e){};$('cnt').textContent=cart.reduce((s,i)=>s+i.qty,0)};
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}

async function init(){
  save();
  const [c,p,s]=await Promise.all([db.from('categories').select('*').order('id'),db.from('products').select('*').order('created_at',{ascending:false}),db.from('settings').select('*').eq('key','card_number')]);
  cats=c.data||[];products=p.data||[];card=(s.data&&s.data[0]&&s.data[0].value)||'';
  renderCats();render();
}
function renderCats(){
  $('cats').innerHTML=`<button class="chip ${cat===0?'on':''}" onclick="setCat(0)">Баары</button>`+cats.map(c=>`<button class="chip ${cat===c.id?'on':''}" onclick="setCat(${c.id})">${esc(c.name)}</button>`).join('');
}
function setCat(id){cat=id;$('q').blur();renderCats();render()}
const isF=e=>e&&['INPUT','TEXTAREA','SELECT'].includes(e.tagName);
document.addEventListener('touchmove',()=>{const a=document.activeElement;if(isF(a))a.blur()},{passive:true});
document.addEventListener('touchstart',e=>{const a=document.activeElement;if(isF(a)&&!isF(e.target))a.blur()},{passive:true});
function render(){
  const q=$('q').value.toLowerCase(),so=$('sort').value;
  let l=products.filter(p=>(q||!cat||p.category_id===cat)&&p.name.toLowerCase().includes(q));
  if(so)l.sort((a,b)=>so==='asc'?a.price-b.price:b.price-a.price);
  $('grid').innerHTML=l.length?l.map((p,i)=>`<div class="p" style="animation-delay:${Math.min(i,8)*50}ms" onclick="openP(${p.id})"><div class="im"><img loading="lazy" src="${esc((p.images||[])[0]||'')}" alt="">${p.is_new?'<i class="badge">Жаңы</i>':''}</div><b>${esc(p.name)}</b><span>${som(p.price)}</span></div>`).join(''):'<p style="grid-column:1/-1;color:#80807a;padding:20px 0">Кийим табылган жок.</p>';
}
function openSheet(h){$('box').innerHTML=h;$('sheet').classList.add('open')}
function closeSheet(){$('sheet').classList.remove('open')}
let sel={};
function openP(id){
  const p=products.find(x=>x.id===id),im=p.images||[];
  sel={id,size:(p.sizes||[])[0]||'',color:(p.colors||[])[0]||''};
  const chips=(arr,k)=>(arr||[]).map((v,i)=>`<button class="chip ${i===0?'on':''}" onclick="pick('${k}',this)">${esc(v)}</button>`).join('');
  openSheet(`<img class="big" id="bigim" src="${esc(im[0]||'')}" alt="">
  ${im.length>1?`<div class="thumbs">${im.map((u,i)=>`<img class="${i===0?'on':''}" src="${esc(u)}" onclick="gal(this)">`).join('')}</div>`:''}
  <h2 style="margin-top:12px">${esc(p.name)}</h2><b style="color:var(--acc);font-size:21px">${som(p.price)}</b>
  <p style="color:#555;margin:10px 0;line-height:1.5">${esc(p.description)}</p>
  ${p.sizes&&p.sizes.length?`<small>Өлчөм</small><div class="opt">${chips(p.sizes,'size')}</div>`:''}
  ${p.colors&&p.colors.length?`<small>Түс</small><div class="opt">${chips(p.colors,'color')}</div>`:''}
  <button class="btn" onclick="addCart()">Себетке кошуу</button>`);
}
function gal(el){$('bigim').src=el.src;[...el.parentNode.children].forEach(c=>c.classList.remove('on'));el.classList.add('on')}
function pick(k,el){sel[k]=el.textContent;[...el.parentNode.children].forEach(c=>c.classList.remove('on'));el.classList.add('on')}
function addCart(){
  const p=products.find(x=>x.id===sel.id);
  const f=cart.find(i=>i.id===p.id&&i.size===sel.size&&i.color===sel.color);
  if(f)f.qty++;else cart.push({id:p.id,name:p.name,price:p.price,img:(p.images||[])[0]||'',size:sel.size,color:sel.color,qty:1});
  save();closeSheet();toast('Себетке кошулду ✓');
}
function openCart(){
  if(!cart.length)return openSheet('<h2>Себет бош</h2><p style="color:#80807a;margin-bottom:8px">Кийим тандап, себетке кошуңуз.</p><button class="btn alt" onclick="closeSheet()">Жабуу</button>');
  const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
  openSheet(`<h2>Себет</h2>`+cart.map((i,n)=>`<div class="row"><img src="${esc(i.img)}" alt=""><div style="flex:1"><b>${esc(i.name)}</b><br><small>${esc(i.size)} ${esc(i.color)} · ${som(i.price)}</small></div>
  <button class="chip" onclick="qty(${n},-1)">−</button><b>${i.qty}</b><button class="chip" onclick="qty(${n},1)">+</button><button class="x" onclick="del(${n})">×</button></div>`).join('')+
  `<div class="row"><b>Жалпы:</b><b>${som(total)}</b></div><button class="btn" onclick="checkout()">Буйрутма берүү</button>`);
}
function qty(n,d){cart[n].qty+=d;if(cart[n].qty<1)cart.splice(n,1);save();openCart()}
function del(n){cart.splice(n,1);save();openCart()}
function checkout(){
  const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
  openSheet(`<h2>Буйрутма</h2><div style="display:grid;gap:10px">
  <input id="fn" placeholder="Аты-жөнү" enterkeyhint="done" onkeydown="if(event.key==='Enter')this.blur()"><input id="ph" type="tel" placeholder="Телефон номери"><textarea id="ad" rows="2" placeholder="Дарек: шаар, көчө, үй" enterkeyhint="done" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"></textarea></div>
  <div class="pay"><small>1. Төмөнкү картага которуңуз</small><b>${esc(card)}</b><small>Сумма: ${som(total)}</small></div>
  <small>2. Төлөм скриншотун жүктөңүз</small><input id="pf" type="file" accept="image/*" style="margin-top:6px">
  <button class="btn" id="sbtn" onclick="send()">Төлөдүм, буйрутма берүү</button><p id="err" style="color:#c33;margin-top:8px"></p>`);
}
async function send(){
  const n=$('fn').value.trim(),p=$('ph').value.trim(),a=$('ad').value.trim(),f=$('pf').files[0],err=$('err'),btn=$('sbtn');
  if(n.length<2||p.length<7||a.length<5){err.textContent='Бардык талааларды толтуруңуз.';return}
  if(!f){err.textContent='Төлөм скриншотун жүктөңүз.';return}
  if(f.size>5*1024*1024){err.textContent='Сүрөт 5 МБ дан чоң болбосун.';return}
  btn.disabled=true;btn.textContent='Жөнөтүлүп жатат...';err.textContent='';
  try{
    const ext=((f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg').slice(0,5);
    const id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);
    const path=`${id}.${ext}`;
    const up=await db.storage.from('proofs').upload(path,f,{contentType:f.type||'image/jpeg'});
    if(up.error)throw up.error;
    const url=db.storage.from('proofs').getPublicUrl(path).data.publicUrl;
    const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
    const {error}=await db.from('orders').insert({customer_name:n,phone:p,address:a,total,payment_proof:url,tg_id:tgId,status:'Төлөм текшерилүүдө',items:cart.map(({name,size,color,qty,price})=>({name,size,color,qty,price}))});
    if(error)throw error;
    cart=[];save();openSheet('<h2>Рахмат! ✅</h2><p style="line-height:1.5">Буйрутмаңыз кабыл алынды. Төлөмдү текшерип, сиз менен байланышабыз.</p><button class="btn" onclick="closeSheet()">Жабуу</button>');
  }catch(e){err.textContent='Ката: '+((e&&e.message)||'белгисиз');btn.disabled=false;btn.textContent='Төлөдүм, буйрутма берүү'}
}
init();
</script>
</body>
</html>
